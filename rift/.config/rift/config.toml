# Workspace indices are 0-based: 1-9 => 0-8, A B C D E F G I M N O P Q R S T U V W X Y Z => 9-30

[settings]
animate = false
default_disable = false
hot_reload = true
focus_follows_mouse = false
mouse_follows_focus = true
mouse_hides_on_focus = false
auto_focus_blacklist = []
run_on_start = []

[settings.layout]
mode = "traditional"

[settings.layout.traditional]
equalize_nodes = true

[settings.layout.stack]
stack_offset = 30.0

[settings.layout.gaps.outer]
top = 10
left = 10
bottom = 10
right = 10

[settings.layout.gaps.inner]
horizontal = 10
vertical = 10

[settings.ui.menu_bar]
enabled = true
display_style = "label"
active_label = "name"

[virtual_workspaces]
enabled = true
default_workspace_count = 31
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
prevent_wrapping = false
workspace_rules = []
workspace_names = [
	"1", "2", "3", "4", "5", "6", "7", "8", "9",
	"A", "B", "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q", "R", "S", "T", "U", "V", "W", "X", "Y", "Z",
]

# on-window-detected
app_rules = [
	{ app_id = "com.mitchellh.ghostty", workspace = "T" },
	{ app_id = "app.zen-browser.zen", workspace = "A" },
]

[modifier_combinations]
hyper = "Ctrl + Shift + Alt"
hypercmd = "Ctrl + Shift + Alt + Meta"

[keys]
# layout
"hyper + Slash" = "toggle_orientation"
"hyper + Comma" = "toggle_stack"

# focus
"hyper + H" = { move_focus = "left" }
"hyper + J" = { move_focus = "down" }
"hyper + K" = { move_focus = "up" }
"hyper + L" = { move_focus = "right" }

# move
"hypercmd + H" = { move_node = "left" }
"hypercmd + J" = { move_node = "down" }
"hypercmd + K" = { move_node = "up" }
"hypercmd + L" = { move_node = "right" }

# resize
"hyper + Minus" = { resize_window_shrink = "smart" }
"hyper + Equal" = { resize_window_grow = "smart" }

# switch workspace
"hyper + 1" = { switch_to_workspace = 0 }
"hyper + 2" = { switch_to_workspace = 1 }
"hyper + 3" = { switch_to_workspace = 2 }
"hyper + 4" = { switch_to_workspace = 3 }
"hyper + 5" = { switch_to_workspace = 4 }
"hyper + 6" = { switch_to_workspace = 5 }
"hyper + 7" = { switch_to_workspace = 6 }
"hyper + 8" = { switch_to_workspace = 7 }
"hyper + 9" = { switch_to_workspace = 8 }
"hyper + A" = { switch_to_workspace = 9 }
"hyper + B" = { switch_to_workspace = 10 }
"hyper + C" = { switch_to_workspace = 11 }
"hyper + D" = { switch_to_workspace = 12 }
"hyper + E" = { switch_to_workspace = 13 }
"hyper + F" = { switch_to_workspace = 14 }
"hyper + G" = { switch_to_workspace = 15 }
"hyper + I" = { switch_to_workspace = 16 }
"hyper + M" = { switch_to_workspace = 17 }
"hyper + N" = { switch_to_workspace = 18 }
"hyper + O" = { switch_to_workspace = 19 }
"hyper + P" = { switch_to_workspace = 20 }
"hyper + Q" = { switch_to_workspace = 21 }
"hyper + R" = { switch_to_workspace = 22 }
"hyper + S" = { switch_to_workspace = 23 }
"hyper + T" = { switch_to_workspace = 24 }
"hyper + U" = { switch_to_workspace = 25 }
"hyper + V" = { switch_to_workspace = 26 }
"hyper + W" = { switch_to_workspace = 27 }
"hyper + X" = { switch_to_workspace = 28 }
"hyper + Y" = { switch_to_workspace = 29 }
"hyper + Z" = { switch_to_workspace = 30 }

# move window to workspace
"hypercmd + 1" = { move_window_to_workspace = 0 }
"hypercmd + 2" = { move_window_to_workspace = 1 }
"hypercmd + 3" = { move_window_to_workspace = 2 }
"hypercmd + 4" = { move_window_to_workspace = 3 }
"hypercmd + 5" = { move_window_to_workspace = 4 }
"hypercmd + 6" = { move_window_to_workspace = 5 }
"hypercmd + 7" = { move_window_to_workspace = 6 }
"hypercmd + 8" = { move_window_to_workspace = 7 }
"hypercmd + 9" = { move_window_to_workspace = 8 }
"hypercmd + A" = { move_window_to_workspace = 9 }
"hypercmd + B" = { move_window_to_workspace = 10 }
"hypercmd + C" = { move_window_to_workspace = 11 }
"hypercmd + D" = { move_window_to_workspace = 12 }
"hypercmd + E" = { move_window_to_workspace = 13 }
"hypercmd + F" = { move_window_to_workspace = 14 }
"hypercmd + G" = { move_window_to_workspace = 15 }
"hypercmd + I" = { move_window_to_workspace = 16 }
"hypercmd + M" = { move_window_to_workspace = 17 }
"hypercmd + N" = { move_window_to_workspace = 18 }
"hypercmd + O" = { move_window_to_workspace = 19 }
"hypercmd + P" = { move_window_to_workspace = 20 }
"hypercmd + Q" = { move_window_to_workspace = 21 }
"hypercmd + R" = { move_window_to_workspace = 22 }
"hypercmd + S" = { move_window_to_workspace = 23 }
"hypercmd + T" = { move_window_to_workspace = 24 }
"hypercmd + U" = { move_window_to_workspace = 25 }
"hypercmd + V" = { move_window_to_workspace = 26 }
"hypercmd + W" = { move_window_to_workspace = 27 }
"hypercmd + X" = { move_window_to_workspace = 28 }
"hypercmd + Y" = { move_window_to_workspace = 29 }
"hypercmd + Z" = { move_window_to_workspace = 30 }

"hyper + Tab" = "switch_to_last_workspace"
"hypercmd + Tab" = { move_workspace_to_display = { selector = "right", wrap_around = true } }

# service mode
"hyper + Semicolon" = { binding_mode = "service" }

# rift has no multi-command bindings, so each service-mode action keeps you
# in service mode until you press Escape.
[binding_modes.service]
"Escape" = { binding_mode = "default" }
"R" = "reload_config"
"F" = "toggle_window_floating"
"U" = "unjoin_windows"
"hyper + H" = { join_window = "left" }
"hyper + J" = { join_window = "down" }
"hyper + K" = { join_window = "up" }
"hyper + L" = { join_window = "right" }
